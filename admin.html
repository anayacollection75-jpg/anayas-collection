<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anaya's Collection - Admin Panel</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff0f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .panel {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 20px #00000012;
      text-align: center;
    }
    h1 { color: #c2185b; margin-bottom: 8px; }
    p { color: #777; }
    input {
      width: 100%;
      padding: 13px;
      margin: 15px 0;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      background: #c2185b;
      color: white;
      border: 0;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #a3154d; }
    #message { margin-top: 15px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Anaya's Collection</h1>
    <p>Admin Login Panel</p>

    <form id="loginForm">
      <input
        type="password"
        id="password"
        placeholder="Enter Admin Password"
        required
      >
      <button type="submit" id="loginButton">Login</button>
    </form>

    <div id="message"></div>
  </div>
  <div id="dashboard" style="display:none; padding:25px; text-align:center;">
    <h2>Welcome to Anaya's Collection</h2>
    <h3>Admin Dashboard</h3>

    <button type="button" id="addCollectionButton">Add Collection</button>
   <div id="collectionForm" style="display:none; margin:20px auto; max-width:400px; background:#fff0f5; padding:20px; border-radius:10px;">

  <h3>Add New Collection</h3>

  <input
    type="text"
    id="collectionName"
    placeholder="Collection Name"
    required
  >

  <input
    type="text"
    id="collectionDescription"
    placeholder="Collection Description"
  >

  <button type="button" id="saveCollectionButton">
    Save Collection
  </button>

  <p id="collectionMessage"></p>

</div>
    <button type="button" id="manageProductsButton">
  Manage Products
</button>
    <button type="button" id="manageCollectionsButton">Manage Collections</button>
<div id="collectionsList" style="max-width:500px; margin:20px auto; text-align:left;"></div>
    <div id="productsList" style="max-width:800px; margin:20px auto; text-align:left;"></div>
    <br><br>
    <button onclick="location.reload()">Logout</button>
  </div>
  <script>
    const API_URL = "https://anaya-admin-api.anayacollection75.workers.dev";
    document.getElementById("manageProductsButton").addEventListener("click", async function() {
  const list = document.getElementById("productsList");
  const token = sessionStorage.getItem("anayaAdminToken");

  list.innerHTML = "Loading Products...";

  try {
    const response = await fetch(API_URL + "/api/products", {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    const data = await response.json();

    if (!data.success) {
      list.textContent = data.message || "Products could not be loaded";
      return;
    }

    list.innerHTML = "<h2>All Products (" + data.products.length + ")</h2>";

   data.products.forEach(product => {
  const item = document.createElement("div");
  item.style.cssText = "background:#fff0f5; padding:15px; margin:12px 0; border-radius:10px;";

  const title = document.createElement("h3");
  title.textContent = product.name + " (" + product.article_number + ")";

  const collection = document.createElement("p");
  collection.textContent = "Collection: " + product.collection_name;

  const price = document.createElement("p");
  price.textContent = "COD: Rs. " + product.cod_price + " | Advance: Rs. " + product.advance_price;

  const images = document.createElement("p");
  images.textContent = "Total Images: " + product.images.length;

  const editButton = document.createElement("button");
  editButton.textContent = "Edit Product";
     const deleteButton = document.createElement("button");
deleteButton.textContent = "Delete Product";
deleteButton.style.background = "#dc3545";
deleteButton.style.color = "white";
deleteButton.style.marginLeft = "10px";

deleteButton.onclick = async function() {
  const confirmDelete = confirm(
    "Are you sure you want to delete " + product.article_number + "?"
  );

  if (!confirmDelete) return;

  try {
    const response = await fetch(API_URL + "/api/products/" + product.id, {
      method: "DELETE",
      headers: {
        "Authorization": "Bearer " + sessionStorage.getItem("anayaAdminToken")
      }
    });

    const result = await response.json();

    if (result.success) {
      alert("Product deleted successfully!");
      document.getElementById("manageProductsButton").click();
    } else {
      alert(result.message || "Delete failed");
    }
  } catch (error) {
    alert("Error: " + error.message);
  }
};

  editButton.onclick = async function() {
    const article = prompt("Article Number:", product.article_number);
    if (article === null) return;

    const name = prompt("Product Name:", product.name);
    if (name === null) return;

    const description = prompt("Product Description:", product.description || "");
    if (description === null) return;

    const cod = prompt("COD Price:", product.cod_price);
    if (cod === null) return;

    const advance = prompt("Advance Price:", product.advance_price);
    if (advance === null) return;

    if (
      !article.trim() ||
      !name.trim() ||
      cod.trim() === "" ||
      advance.trim() === "" ||
      !Number.isFinite(Number(cod)) ||
      !Number.isFinite(Number(advance))
    ) {
      alert("Please enter valid product details and prices.");
      return;
    }

    try {
      const response = await fetch(API_URL + "/api/products/" + product.id, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + sessionStorage.getItem("anayaAdminToken")
        },
        body: JSON.stringify({
          collection_id: product.collection_id,
          article_number: article.trim(),
          name: name.trim(),
          description: description,
          cod_price: Number(cod),
          advance_price: Number(advance),
          is_active: product.is_active
        })
      });

      const result = await response.json();

      if (result.success) {
        alert("Product updated successfully!");
        document.getElementById("manageProductsButton").click();
      } else {
        alert(result.message || "Update failed");
      }

    } catch (error) {
      alert("Error: " + error.message);
    }
  };

  item.append(title, collection, price, images, editButton, deleteButton);
  list.appendChild(item);
});
  } catch (error) {
    list.textContent = "Error: " + error.message;
  }
});
    document.getElementById("manageCollectionsButton").addEventListener("click", async function() {
  const list = document.getElementById("collectionsList");
  const token = sessionStorage.getItem("anayaAdminToken");

  list.textContent = "Loading collections...";

  try {
    const response = await fetch(API_URL + "/api/collections", {
      method: "GET",
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    const result = await response.json();

    if (!result.success) {
      list.textContent = result.message || "Unable to load collections.";
      return;
    }

    list.innerHTML = "";

    if (result.collections.length === 0) {
      list.textContent = "No collections found.";
      return;
    }

    result.collections.forEach(function(collection) {
      const item = document.createElement("div");
      item.style.background = "white";
      item.style.padding = "12px";
      item.style.margin = "10px 0";
      item.style.borderRadius = "8px";

      const name = document.createElement("strong");
      name.textContent = collection.name;

      const description = document.createElement("p");
      description.textContent = collection.description || "";

     item.appendChild(name);
item.appendChild(description);

const editButton = document.createElement("button");
editButton.textContent = "Edit";

editButton.addEventListener("click", function() {
  const editName = document.createElement("input");
  editName.value = collection.name;
  editName.placeholder = "Collection Name";

  const editDescription = document.createElement("input");
  editDescription.value = collection.description || "";
  editDescription.placeholder = "Collection Description";

  const saveButton = document.createElement("button");
  saveButton.textContent = "Save Changes";

  item.appendChild(editName);
  item.appendChild(editDescription);
  item.appendChild(saveButton);

  saveButton.addEventListener("click", async function() {
    const token = sessionStorage.getItem("anayaAdminToken");

    try {
      const response = await fetch(API_URL + "/api/collections/" + collection.id, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
          name: editName.value.trim(),
          description: editDescription.value.trim()
        })
      });

      const result = await response.json();
      alert(result.message);

      if (result.success) {
        document.getElementById("manageCollectionsButton").click();
      }
    } catch (error) {
      alert("Connection error. Please try again.");
    }
  });
});

item.appendChild(editButton);
list.appendChild(item);
    });

  } catch (error) {
    list.textContent = "Connection error. Please try again.";
  }
});
    document.getElementById("saveCollectionButton").addEventListener("click", async function() {
  const name = document.getElementById("collectionName").value.trim();
  const description = document.getElementById("collectionDescription").value.trim();
  const message = document.getElementById("collectionMessage");
  const token = sessionStorage.getItem("anayaAdminToken");

  if (!name) {
    message.style.color = "red";
    message.textContent = "Please enter collection name.";
    return;
  }

  try {
    const response = await fetch(API_URL + "/api/collections", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({ name, description })
    });

    const result = await response.json();
    message.style.color = result.success ? "green" : "red";
    message.textContent = result.message || "Something went wrong.";

    if (result.success) {
      document.getElementById("collectionName").value = "";
      document.getElementById("collectionDescription").value = "";
    }
  } catch (error) {
    message.style.color = "red";
    message.textContent = "Connection error. Please try again.";
  }
});
document.getElementById("addCollectionButton").addEventListener("click", function() {
  document.getElementById("collectionForm").style.display = "block";
});
    document.getElementById("loginForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const message = document.getElementById("message");
      const button = document.getElementById("loginButton");

      button.disabled = true;
      button.textContent = "Please wait...";
      message.textContent = "";

      try {
        const response = await fetch(API_URL + "/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });

        const result = await response.json();

        if (result.success) {
          sessionStorage.setItem("anayaAdminToken", result.token);
          message.style.color = "green";
          message.textContent = "Login successful!";
          document.getElementById("loginForm").style.display = "none";
document.getElementById("message").style.display = "none";
document.getElementById("dashboard").style.display = "block";
        } else {
          message.style.color = "red";
          message.textContent = result.message || "Login failed.";
        }
      } catch (error) {
        message.style.color = "red";
        message.textContent = "Connection error. Please try again.";
      }

      button.disabled = false;
      button.textContent = "Login";
    });
  </script>
</body>
</html>
